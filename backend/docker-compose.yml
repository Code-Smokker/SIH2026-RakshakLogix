# ============================================================
# RakshakLogix — Docker Compose
# Local development environment:
#   api       — FastAPI backend
#   db        — PostgreSQL 16 with PostGIS 3
#   redis     — Redis 7 (Celery broker + result backend)
# ============================================================

name: rakshaklogix

services:

  # ── PostgreSQL 16 + PostGIS 3 ──────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: rakshaklogix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakshak_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rakshaklogix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakshak} -d ${POSTGRES_DB:-rakshaklogix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rakshaklogix_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rakshaklogix_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak_dev}@db:5432/${POSTGRES_DB:-rakshaklogix}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak_dev}@db:5432/${POSTGRES_DB:-rakshaklogix}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./scripts:/app/scripts:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rakshaklogix_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak_dev}@db:5432/${POSTGRES_DB:-rakshaklogix}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak_dev}@db:5432/${POSTGRES_DB:-rakshaklogix}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rakshaklogix_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    name: rakshaklogix_pgdata
  redisdata:
    name: rakshaklogix_redisdata
