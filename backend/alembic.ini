# ============================================================
# Alembic configuration for RakshakLogix
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# %%(rev)s  - revision identifier
# %%(slug)s - short description
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path modification
prepend_sys_path = .

# Timezone for revision file timestamps
timezone = UTC

# SQLAlchemy URL is dynamically set in env.py from application settings
# Do not hard-code credentials here
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
