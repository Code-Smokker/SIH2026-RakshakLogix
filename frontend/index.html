<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RakshakLogix — Defence Logistics Command Platform</title>
    <!-- IBM Plex Sans & IBM Plex Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 18px;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #ecefe7;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #c3c8c2;
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #737873;
      }
      .tactical-grid-bg {
        background-size: 24px 24px;
        background-image: 
          linear-gradient(to right, rgba(115, 120, 115, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(115, 120, 115, 0.08) 1px, transparent 1px);
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased font-sans min-h-screen overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-fixed">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
